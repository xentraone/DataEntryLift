plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xentraone.dataentrylift'
    compileSdk 35

    defaultConfig {
        applicationId "com.xentraone.dataentrylift"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "1.8"
    }

    // Fixed debug key committed to the repo so every CI build is signed the
    // same way — updates then install over the old version WITHOUT deleting
    // the app's data. (Random per-build keys force an uninstall.)
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // On-device text recognition (bundled model, works offline) for the
    // "report image -> entries" import.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
