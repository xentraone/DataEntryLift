name: Build debug APK

on:
  push:
    branches:
      - claude/data-entry-weekly-reports-bebtk8
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataEntryLift-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk
          name: Lift Work Diary — debug APK
          prerelease: true
          body: |
            Latest debug build of the Lift Work Diary app.

            **Install on the phone:** download `app-debug.apk` below, open it,
            and allow "install from unknown sources" when Android asks.
          files: app/build/outputs/apk/debug/app-debug.apk
